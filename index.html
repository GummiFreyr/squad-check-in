<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Squad Check-in</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sacramento&display=swap">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png?v=xmas">
<link rel="apple-touch-icon" href="icon-180.png?v=xmas">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Squad">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0c1716">
<style>
/* Christmas, quietly: a winter-night column under a warm candle glow, with light snow.
   Built to feel like a native iPhone app: system font, springy taps, gliding lists.
   Deliberately dark in both system themes. */
:root {
  --bg: #0c1716;        /* winter night, a hint of pine */
  --glow: #3b1a16;      /* warm fireplace glow at the top */
  --ink: #f4efe6;       /* snow white */
  --muted: #8d9a97;
  --line: #22302e;
  --card: #15201f; --card-solid: #15201f;      /* solid, so snow never shows through cards */
  --accent: #e9c46a;    /* candle gold */
  --berry: #e5484d;
  --yes: #4cc38a;       /* holly green */
  --maybe: #f2c14e;     /* gold */
  --no: #e5484d;        /* berry red */
  --on-yes: #06210f;
  --on-maybe: #2b1d00;
  --on-no: #2a0507;
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, system-ui, sans-serif;
  --font-display: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, system-ui, sans-serif;
  --spring: cubic-bezier(.34, 1.56, .64, 1);   /* little overshoot, like iOS */
  --ease: cubic-bezier(.2, .8, .2, 1);
  color-scheme: dark;
}
* { box-sizing: border-box; }
/* Normal, native iPhone scrolling (with the bounce). The warm glow is a fixed layer that
   reaches well above the screen, so pulling down past the top never shows an edge. */
html { -webkit-text-size-adjust: 100%; background: var(--bg); scrollbar-width: none; }
html::-webkit-scrollbar, body::-webkit-scrollbar { display: none; }
body {
  margin: 0; min-height: 100vh; color: var(--ink); background: transparent;
  -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
  font-family: var(--font); font-size: 16px; line-height: 1.45; -webkit-font-smoothing: antialiased;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-top: calc(env(safe-area-inset-top, 0px) + 28px);
  padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 48px);
  -webkit-tap-highlight-color: transparent;
}
[hidden] { display: none !important; }
input { -webkit-user-select: text; user-select: text; -webkit-touch-callout: default; }
button { touch-action: manipulation; -webkit-user-select: none; user-select: none; }
/* Snow only falls in the sky at the top and fades out before the content, so it never crosses the list */
body::before {
  content: ""; position: fixed; left: 0; right: 0; top: -60vh; height: 115vh; z-index: -1; pointer-events: none;
  background: radial-gradient(ellipse 130% 40% at 50% 52%, var(--glow), transparent 70%), var(--bg);
}
#snow {
  position: fixed; inset: 0 0 auto 0; width: 100%; height: 46vh; pointer-events: none; z-index: 0;
  -webkit-mask-image: linear-gradient(to bottom, #000 45%, transparent);
  mask-image: linear-gradient(to bottom, #000 45%, transparent);
}
.wrap { touch-action: pan-y; }
.wrap { position: relative; z-index: 1; max-width: 440px; margin: 0 auto; display: flex; flex-direction: column; gap: 30px; }
.date { font-size: 0.8rem; font-weight: 600; color: var(--accent); text-transform: uppercase; letter-spacing: 0.08em; text-align: center; margin: 0 0 6px; }
.ask {
  font-family: var(--font-display); font-weight: 700; font-size: 2rem; line-height: 1.12; letter-spacing: -0.02em;
  text-align: center; margin: 0; text-wrap: balance;
}

/* Christmas lights: the title is written in one looping script line, like a light cord bent
   into letters. The cord carries on out of the words into a loop and a drape with classic
   bulbs. Bulbs twinkle slowly and out of step, never flash. */
.title-wrap { position: relative; padding: 30px 0 64px; }
.title-wrap .ask {
  position: relative; z-index: 1;
  font-family: "Sacramento", "Snell Roundhand", cursive; font-weight: 400;
  font-size: 3.5rem; line-height: 1.3; letter-spacing: 0; color: var(--cordc);
  -webkit-text-stroke: .7px var(--cordc);
}
.title-wrap { --cordc: #f1ebdf; }
.lights { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none; }
.lights.back { display: none; }
.lights.front { z-index: 2; }
.lights .cord { fill: none; stroke: var(--cordc); stroke-width: 2.3; stroke-linecap: round; stroke-linejoin: round; }
.lights .socket { fill: #9aa6a2; }
.lights .plug { fill: var(--cordc); }
.lights .bulb { animation: twinkle 3.6s ease-in-out infinite; }
.lights .bulb.b { animation-duration: 4.4s; animation-delay: -1.2s; }
.lights .bulb.c { animation-duration: 5.2s; animation-delay: -2.6s; }
@keyframes twinkle { 0%, 100% { opacity: 1; } 50% { opacity: .72; } }

/* Answer buttons: springy press, colour fills in when chosen */
.choices { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; transition: opacity .3s var(--ease); }
.choice {
  --c: var(--line); --on: var(--ink);
  font: 600 1rem var(--font); padding: 17px 6px; border-radius: 16px; cursor: pointer;
  border: 2px solid var(--c); background: transparent; color: var(--c);
  transition: background-color .25s var(--ease), color .25s var(--ease), transform .45s var(--spring), box-shadow .3s var(--ease);
}
.choice[data-s="yes"] { --c: var(--yes); --on: var(--on-yes); }
.choice[data-s="maybe"] { --c: var(--maybe); --on: var(--on-maybe); }
.choice[data-s="no"] { --c: var(--no); --on: var(--on-no); }
@media (hover: hover) { .choice:hover { background-color: color-mix(in srgb, var(--c) 12%, transparent); } }
.choice[aria-pressed="true"] { background-color: var(--c); color: var(--on); box-shadow: 0 6px 22px -8px var(--c); }
.choice:active { transform: scale(0.93); transition-duration: .12s, .12s, .12s, .12s; }
.choice.pop { animation: pop .45s var(--spring); }
@keyframes pop { 0% { transform: scale(0.93); } 60% { transform: scale(1.04); } 100% { transform: scale(1); } }
.choice:focus-visible, .nick:focus-visible, .day:focus-visible, .remind button:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }
.choices.locked .choice { opacity: .3; }

.nick {
  display: block; margin: 0 auto 18px; width: 100%; max-width: 230px; text-align: center;
  font: 500 17px var(--font); color: var(--ink); background: transparent;
  border: 0; border-bottom: 1px solid var(--line); padding: 6px 4px; border-radius: 0;
  transition: border-color .3s var(--ease);
}
.nick::placeholder { color: var(--muted); }
.nick.need { border-bottom: 2px solid var(--accent); }

/* Small status line that fades in and out */
.status { font-size: 0.82rem; color: var(--muted); text-align: center; min-height: 1.3em; margin: 10px 0 0; opacity: 0; transform: translateY(3px); transition: opacity .3s var(--ease), transform .3s var(--ease); }
.status.show { opacity: 1; transform: none; }
.status.err { color: var(--no); }
.claim { margin-top: 14px; display: flex; flex-direction: column; gap: 10px; text-align: center; }
.claim p { margin: 0; font-size: 0.92rem; }

/* Who's playing: an iOS-style inset list */
.roster { list-style: none; margin: 0; padding: 0 14px; display: flex; flex-direction: column; background: var(--card); border-radius: 16px; }
.roster:empty { display: none; }
.roster li { display: flex; align-items: center; gap: 12px; padding: 13px 0; position: relative; }
.roster li + li::before { content: ""; position: absolute; top: 0; left: 22px; right: 0; height: 1px; background: var(--line); }
.dot { width: 10px; height: 10px; border-radius: 50%; flex: none; transition: background-color .3s var(--ease); }
.dot.yes { background: var(--yes); } .dot.maybe { background: var(--maybe); } .dot.no { background: var(--no); }
.who { flex: 1; min-width: 0; overflow-wrap: anywhere; font-weight: 500; }
.who small { color: var(--muted); font-weight: 400; }
.tag { font-size: 0.82rem; font-weight: 600; transition: color .3s var(--ease); }
.tag.yes { color: var(--yes); } .tag.maybe { color: var(--maybe); } .tag.no { color: var(--no); }
.empty { color: var(--muted); margin: 0; text-align: center; font-size: 0.92rem; }

/* Week strip with a selection bubble that slides between days */
.week { position: relative; display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; padding: 4px; background: var(--card); border-radius: 18px; }
.week .pill {
  position: absolute; top: 4px; bottom: 4px; left: 4px; width: calc((100% - 32px) / 7);
  border-radius: 14px; background: rgba(255, 255, 255, 0.1); box-shadow: 0 1px 0 rgba(255,255,255,.06) inset;
  transition: transform .38s var(--ease); /* glides like the iOS switcher, never overshoots the edges */
}
.day {
  position: relative; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 8px 0 9px; border-radius: 14px;
  background: transparent; border: 0; cursor: pointer; color: var(--muted); font: inherit; transition: color .25s var(--ease), transform .35s var(--spring);
}
.day:active { transform: scale(0.92); transition-duration: .12s; }
.day[aria-current="true"] { color: var(--ink); }
.day .dn { font-size: 0.68rem; font-weight: 600; text-transform: uppercase; letter-spacing: .05em; }
.day .dd { font-size: 1rem; font-weight: 600; font-variant-numeric: tabular-nums; }
.day .bar { display: flex; flex-wrap: wrap; justify-content: center; gap: 2px; row-gap: 2px; min-height: 6px; max-width: 34px; }
.day .bar i { width: 6px; height: 6px; border-radius: 50%; background: var(--yes); animation: dotIn .35s var(--spring) backwards; }
.day .bar i.maybe { background: var(--maybe); }
.day .bar i.no { background: var(--no); }
@keyframes dotIn { from { transform: scale(0); } }

/* Time picker folds open smoothly */
/* Sparkles when you tap I'm in */
#fx { position: fixed; inset: 0; pointer-events: none; z-index: 50; overflow: hidden; }
#fx i { position: absolute; left: 0; top: 0; border-radius: 50%; will-change: transform, opacity; }
.collapse { display: grid; grid-template-rows: 0fr; opacity: 0; transition: grid-template-rows .42s var(--ease), opacity .3s var(--ease); }
.collapse.open { grid-template-rows: 1fr; opacity: 1; }
.collapse > .inner { min-height: 0; overflow: hidden; }
.times-inner { padding-top: 16px; display: flex; flex-direction: column; gap: 8px; }
.times-label { margin: 0; font-size: 0.82rem; color: var(--muted); text-align: center; }
/* iPhone-alarm style wheel: 5 rows visible, the middle one is the pick */
.wheel {
  --row: 36px;
  position: relative; display: flex; justify-content: center; align-items: center; gap: 2px;
  height: calc(var(--row) * 5); user-select: none; -webkit-user-select: none;
  -webkit-mask-image: linear-gradient(to bottom, transparent, #000 32%, #000 68%, transparent);
  mask-image: linear-gradient(to bottom, transparent, #000 32%, #000 68%, transparent);
}
.wheel::before {
  content: ""; position: absolute; left: 50%; top: calc(var(--row) * 2); transform: translateX(-50%);
  width: 150px; height: var(--row); border-radius: 10px; background: rgba(255, 255, 255, 0.09);
}
.wheel-col {
  position: relative; width: 60px; height: 100%; overflow-y: scroll; scroll-snap-type: y mandatory;
  padding-block: calc(var(--row) * 2); overscroll-behavior: contain; scrollbar-width: none; outline: none;
}
.wheel-col::-webkit-scrollbar { display: none; }
.wheel-col:focus-visible { box-shadow: inset 0 0 0 2px var(--ink); border-radius: 10px; }
.wheel-item {
  height: var(--row); line-height: var(--row); text-align: center; scroll-snap-align: center; cursor: pointer;
  font: 500 1.4rem var(--font); font-variant-numeric: tabular-nums; color: var(--ink); transition: color .3s var(--ease);
}
.wheel.unset .wheel-item { color: var(--muted); }
.wheel-sep { position: relative; font: 600 1.4rem var(--font); color: var(--ink); }
.wheel.unset .wheel-sep { color: var(--muted); }
.time-actions { display: flex; gap: 8px; justify-content: center; }
.chip {
  font: 600 0.84rem var(--font); color: var(--ink); background: var(--card);
  border: 0; border-radius: 999px; padding: 8px 14px; cursor: pointer; min-height: 34px;
  transition: background-color .25s var(--ease), color .25s var(--ease), transform .4s var(--spring);
}
.chip:active { transform: scale(0.93); transition-duration: .12s; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.chip:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.when { font-size: 0.82rem; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }

.remind { text-align: center; font-size: 0.86rem; color: var(--muted); display: flex; flex-direction: column; align-items: center; gap: 8px; }
.remind p { margin: 0; max-width: 32ch; }
.remind button {
  font: 600 0.88rem var(--font); color: var(--ink); background: var(--card); cursor: pointer;
  border: 0; border-radius: 999px; padding: 10px 18px; transition: transform .4s var(--spring);
}
.remind button:active { transform: scale(0.94); transition-duration: .12s; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition-duration: 0s !important; animation: none !important; }
}
</style>
<script src="config.js"></script>
</head>
<body>
<canvas id="snow" aria-hidden="true"></canvas>
<div id="fx" aria-hidden="true"></div>
<div class="wrap">
  <nav class="week" id="week" aria-label="Pick a day"></nav>
  <section>
    <p class="date" id="dateLabel"></p>
    <div class="title-wrap" id="titleWrap">
      <svg class="lights back" id="lightsBack" aria-hidden="true"></svg>
      <p class="ask" id="askLabel">Can you play tonight?</p>
      <svg class="lights front" id="lightsFront" aria-hidden="true"></svg>
    </div>
  </section>

  <section>
    <label for="nick" hidden>Your gamertag</label>
    <input class="nick" id="nick" maxlength="24" autocomplete="nickname" enterkeyhint="done" placeholder="your gamertag">
    <div class="choices" id="choices" role="group" aria-label="Your answer">
      <button class="choice" id="btnYes" data-s="yes" aria-pressed="false">I'm in</button>
      <button class="choice" id="btnMaybe" data-s="maybe" aria-pressed="false">Maybe</button>
      <button class="choice" id="btnNo" data-s="no" aria-pressed="false">Can't</button>
    </div>
    <div class="collapse" id="timesWrap" inert>
     <div class="inner"><div class="times-inner">
      <p class="times-label" id="timesLabel">What time can you get on?</p>
      <div class="wheel unset" id="wheel" role="group" aria-labelledby="timesLabel">
        <div class="wheel-col" id="wheelH" tabindex="0" aria-label="Hour"></div>
        <span class="wheel-sep" aria-hidden="true">:</span>
        <div class="wheel-col" id="wheelM" tabindex="0" aria-label="Minutes"></div>
      </div>
      <div class="time-actions">
        <button class="chip" id="btnNow" type="button" aria-pressed="false">I'm on now</button>
        <button class="chip" id="btnClearTime" type="button">No set time</button>
      </div>
     </div></div>
    </div>
    <div class="claim" id="claim" hidden>
      <p id="claimText"></p>
      <div class="time-actions">
        <button class="chip" id="claimYes" type="button">Yes, that's me</button>
        <button class="chip" id="claimNo" type="button">No, pick another name</button>
      </div>
    </div>
    <p class="status show" id="status">Connecting…</p>
  </section>

  <section aria-label="Who's playing" id="rosterSection">
    <ul class="roster" id="roster"></ul>
    <p class="empty" id="rosterEmpty">No answers yet.</p>
  </section>



  <section class="remind" id="remind" hidden>
    <p id="remindText">Get a daily reminder to check in.</p>
    <button id="remindBtn" type="button">Turn on daily reminder</button>
  </section>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, collection, doc, onSnapshot, setDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { getMessaging, getToken, isSupported } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-messaging.js";

const KEEP_DAYS = 14;
const $ = (id) => document.getElementById(id);
const pad = (n) => String(n).padStart(2, "0");
const keyOf = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const today = new Date(); today.setHours(0, 0, 0, 0);
const days = Array.from({ length: 7 }, (_, i) => { const d = new Date(today); d.setDate(d.getDate() + i); return d; });
const todayKey = keyOf(today);

let selected = todayKey;
let db = null, myId = null, players = {}, writing = false;
const buttons = [$("btnYes"), $("btnMaybe"), $("btnNo")];
const LABEL = { yes: "In", maybe: "Maybe", no: "Can't" };

// The status line fades in; quick confirmations ("Saved") fade out again by themselves.
let statusTimer;
function setStatus(msg, err, brief = false) {
  const s = $("status");
  clearTimeout(statusTimer);
  if (msg) s.textContent = msg;
  s.classList.toggle("err", !!err);
  s.classList.toggle("show", !!msg);
  if (brief) statusTimer = setTimeout(() => s.classList.remove("show"), 1400);
}
const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
const EASE = "cubic-bezier(.2, .8, .2, 1)";
const haptic = () => { try { navigator.vibrate?.(8); } catch {} };
function selDate() { return days.find(d => keyOf(d) === selected) || today; }
function prettyDay(d) {
  if (keyOf(d) === todayKey) return "tonight";
  const t = new Date(today); t.setDate(t.getDate() + 1);
  if (keyOf(d) === keyOf(t)) return "tomorrow";
  return "on " + d.toLocaleDateString(undefined, { weekday: "long" });
}
function nameFor(id) {
  const p = players[id];
  return (p && typeof p.nick === "string" && p.nick.trim()) || "Someone";
}

// "now" sorts first, then times in order, then people who didn't pick a time.
const timeKey = (a) => a.from === "now" ? "00" : (a.from || "99");
const timeText = (from) => from === "now" ? "now" : from;

// --- Time wheel ---------------------------------------------------------------
const ROW = 36;
const HOURS = Array.from({ length: 24 }, (_, h) => pad(h));
const MINS = Array.from({ length: 12 }, (_, i) => pad(i * 5));
let wheelTouched = false, wheelTimer = null, wheelShown = null;

// Each column repeats its values several times so it feels endless (23 → 00).
// After every scroll we quietly jump back to the middle copy.
const COPIES = 7, MID = 3;
const colIndex = (el, n) => ((Math.round(el.scrollTop / ROW) % n) + n) % n;
const recenter = (el, n) => { const top = (MID * n + colIndex(el, n)) * ROW; if (el.scrollTop !== top) el.scrollTop = top; };
const wheelValue = () => `${HOURS[colIndex($("wheelH"), 24)]}:${MINS[colIndex($("wheelM"), 12)]}`;
const myAnswer = () => myId && players[myId]?.days?.[selected];

function defaultTime() {
  if (selected !== todayKey) return "20:00";
  return `${pad(Math.min(new Date().getHours() + 1, 23))}:00`;
}

// Save once the wheel has settled after the person scrolled or tapped it.
function scheduleCommit() {
  wheelTouched = true;
  clearTimeout(wheelTimer);
  wheelTimer = setTimeout(() => {
    wheelTouched = false;
    recenter($("wheelH"), 24); recenter($("wheelM"), 12);
    const v = wheelValue(), mine = myAnswer();
    wheelShown = `${selected}|${v}`;
    if (mine && mine.from !== v) save({ from: v });
  }, 400);
}

function buildCol(el, values) {
  for (let c = 0; c < COPIES; c++) values.forEach((v, i) => {
    const row = c * values.length + i;
    const d = document.createElement("div"); d.className = "wheel-item"; d.textContent = v;
    if (c !== MID) d.setAttribute("aria-hidden", "true");
    d.addEventListener("click", () => { el.scrollTo({ top: row * ROW, behavior: "smooth" }); scheduleCommit(); });
    el.append(d);
  });
  el.addEventListener("scroll", () => { if (wheelTouched) scheduleCommit(); }, { passive: true });
  for (const ev of ["pointerdown", "touchstart", "wheel"]) el.addEventListener(ev, scheduleCommit, { passive: true });
  el.addEventListener("keydown", (e) => {
    if (e.key !== "ArrowDown" && e.key !== "ArrowUp") return;
    e.preventDefault();
    el.scrollBy({ top: e.key === "ArrowDown" ? ROW : -ROW, behavior: "smooth" });
    scheduleCommit();
  });
}
buildCol($("wheelH"), HOURS);
buildCol($("wheelM"), MINS);

function setWheel(from) {
  const [h, m] = from.split(":").map(Number);
  $("wheelH").scrollTop = (MID * 24 + h) * ROW;
  $("wheelM").scrollTop = (MID * 12 + Math.min(11, Math.round(m / 5))) * ROW;
}

$("btnNow").addEventListener("click", () => { const mine = myAnswer(); if (mine) save({ from: mine.from === "now" ? "" : "now" }); });
$("btnClearTime").addEventListener("click", () => save({ from: "" }));

function renderTimes(mine) {
  const wrap = $("timesWrap");
  const show = !!mine && (mine.s === "yes" || mine.s === "maybe");
  wrap.classList.toggle("open", show);
  wrap.inert = !show;
  if (!show) { wheelShown = null; return; }
  const set = !!mine.from && mine.from !== "now";
  $("timesLabel").textContent = mine.from === "now" ? "You're getting on now"
    : set ? `Online from ${mine.from}`
    : mine.s === "yes" ? "Scroll to pick when you'll get on" : "If you can, around what time?";
  $("btnNow").hidden = selected !== todayKey;
  $("btnNow").setAttribute("aria-pressed", String(mine.from === "now"));
  $("btnClearTime").hidden = !mine.from;
  $("wheel").classList.toggle("unset", !set);
  // Move the wheel only when the answer or day changed, never while someone is scrolling it.
  const target = set ? mine.from : defaultTime();
  if (!wheelTouched && wheelShown !== `${selected}|${target}`) { wheelShown = `${selected}|${target}`; setWheel(target); }
}

function render() {
  const d = selDate();
  $("dateLabel").textContent = d.toLocaleDateString(undefined, { weekday: "long", month: "short", day: "numeric" });
  $("askLabel").textContent = `Can you play ${prettyDay(d)}?`;
  drawLights();

  const ids = Object.keys(players);
  const order = { yes: 0, maybe: 1, no: 2 };
  const answered = ids
    .map(id => ({ id, a: players[id]?.days?.[selected] }))
    .filter(x => x.a && order[x.a.s] !== undefined)
    .sort((x, y) => order[x.a.s] - order[y.a.s] || timeKey(x.a).localeCompare(timeKey(y.a)));

  renderRoster(answered);
  $("rosterEmpty").hidden = answered.length > 0;

  const mine = myId && players[myId]?.days?.[selected];
  buttons.forEach(b => b.setAttribute("aria-pressed", String(!!mine && mine.s === b.dataset.s)));
  renderTimes(mine);
  if (document.activeElement !== $("nick") && myId) $("nick").value = players[myId]?.nick || $("nick").value;
  updateLock();

  renderWeek(ids);
}

// --- Week strip: built once, updated in place so the selection bubble can slide ----
const pill = document.createElement("span"); pill.className = "pill"; pill.setAttribute("aria-hidden", "true");
$("week").append(pill);
const dayBtns = days.map((day, i) => {
  const b = document.createElement("button"); b.className = "day"; b.type = "button";
  const dn = document.createElement("span"); dn.className = "dn"; dn.textContent = day.toLocaleDateString(undefined, { weekday: "short" });
  const dd = document.createElement("span"); dd.className = "dd"; dd.textContent = day.getDate();
  const bar = document.createElement("span"); bar.className = "bar";
  b.append(dn, dd, bar);
  b.addEventListener("click", () => selectDay(i));
  $("week").append(b);
  return b;
});

function renderWeek(ids) {
  days.forEach((day, i) => {
    const k = keyOf(day), b = dayBtns[i];
    const count = (s) => ids.filter(id => players[id]?.days?.[k]?.s === s).length;
    const yes = count("yes"), maybe = count("maybe"), no = count("no");
    b.setAttribute("aria-current", String(k === selected));
    b.setAttribute("aria-label", `${day.toLocaleDateString(undefined, { weekday: "long" })}: ${yes} in, ${maybe} maybe, ${no} can't`);
    // One dot per answer: green in, yellow maybe, red can't (up to 8, which wraps to two rows).
    // Only rebuild when the dots changed, so unchanged days don't re-animate.
    const dots = [...Array(yes).fill("yes"), ...Array(maybe).fill("maybe"), ...Array(no).fill("no")].slice(0, 8);
    const bar = b.querySelector(".bar"), sig = dots.join();
    if (bar.dataset.sig !== sig) {
      bar.dataset.sig = sig;
      bar.replaceChildren(...dots.map(cls => { const d = document.createElement("i"); if (cls !== "yes") d.className = cls; return d; }));
    }
  });
  const idx = Math.max(0, days.findIndex(d => keyOf(d) === selected));
  pill.style.transform = `translateX(calc(${idx} * (100% + 4px)))`;
}

// Switching day: the bubble slides, and the question and list glide in from that side.
function selectDay(i) {
  const old = days.findIndex(d => keyOf(d) === selected);
  if (i === old) return;
  haptic();
  selected = keyOf(days[i]);
  rosterSwap = true;
  render();
  if (reduceMotion) return;
  const dx = (i > old ? 1 : -1) * 18;
  for (const el of [$("dateLabel"), $("titleWrap")]) {
    el.animate([{ opacity: 0, transform: `translateX(${dx}px)` }, { opacity: 1, transform: "none" }], { duration: 360, easing: EASE });
  }
}

// --- Swipe left or right anywhere on the page to change day ----------------------
// The question and list follow your finger and the week bubble slides along with it;
// let go past a short distance and it moves to the next day, otherwise it springs back.
(function swipeDays() {
  const area = document.querySelector(".wrap");
  const moving = () => [$("dateLabel"), $("titleWrap"), $("rosterSection")];
  let sx = 0, sy = 0, dx = 0, mode = null, idx = 0;
  area.addEventListener("touchstart", (e) => {
    if (e.touches.length !== 1 || e.target.closest("#wheel, input, .claim")) { mode = "off"; return; }
    sx = e.touches[0].clientX; sy = e.touches[0].clientY; dx = 0; mode = null;
    idx = Math.max(0, days.findIndex(d => keyOf(d) === selected));
  }, { passive: true });
  area.addEventListener("touchmove", (e) => {
    if (mode === "off" || mode === "v") return;
    const x = e.touches[0].clientX - sx, y = e.touches[0].clientY - sy;
    if (!mode) {
      if (Math.abs(x) > 10 && Math.abs(x) > Math.abs(y) * 1.3) mode = "h";
      else if (Math.abs(y) > 10) { mode = "v"; return; }
      else return;
    }
    const edge = (idx === 0 && x > 0) || (idx === days.length - 1 && x < 0);
    dx = edge ? x * 0.25 : x;
    for (const el of moving()) {
      el.style.transition = "none";
      el.style.transform = `translateX(${dx * 0.45}px)`;
      el.style.opacity = String(1 - Math.min(0.45, Math.abs(dx) / 500));
    }
    const frac = Math.max(-1, Math.min(1, -dx / 180));
    pill.style.transition = "none";
    pill.style.transform = `translateX(calc(${idx + frac} * (100% + 4px)))`;
  }, { passive: true });
  const end = () => {
    if (mode !== "h") { mode = null; return; }
    mode = null;
    pill.style.transition = "";
    const go = Math.abs(dx) > 60 ? (dx < 0 ? 1 : -1) : 0;
    const next = idx + go;
    if (go && next >= 0 && next < days.length) {
      for (const el of moving()) { el.style.transition = "none"; el.style.transform = ""; el.style.opacity = ""; }
      selectDay(next);
    } else {
      for (const el of moving()) {
        el.style.transition = `transform .45s cubic-bezier(.34, 1.3, .64, 1), opacity .3s ${EASE}`;
        el.style.transform = ""; el.style.opacity = "";
      }
      renderWeek(Object.keys(players));
    }
  };
  area.addEventListener("touchend", end);
  area.addEventListener("touchcancel", end);
})();

// --- Who's playing: rows are kept between renders so they can glide when the order changes ---
const rowEls = new Map();
let rosterSwap = false;
function renderRoster(answered) {
  const ul = $("roster");
  const swap = rosterSwap; rosterSwap = false;
  const before = new Map();
  for (const [id, li] of rowEls) before.set(id, li.getBoundingClientRect().top);
  const keep = new Set(answered.map(x => x.id));
  for (const [id, li] of rowEls) if (swap || !keep.has(id)) { li.remove(); rowEls.delete(id); }

  const placed = [];
  answered.forEach(({ id, a }, i) => {
    let li = rowEls.get(id);
    const isNew = !li;
    if (isNew) { li = document.createElement("li"); rowEls.set(id, li); }
    const dot = document.createElement("span"); dot.className = `dot ${a.s}`;
    const who = document.createElement("span"); who.className = "who"; who.textContent = nameFor(id);
    if (id === myId) { const s = document.createElement("small"); s.textContent = " (you)"; who.append(s); }
    const tag = document.createElement("span"); tag.className = `tag ${a.s}`; tag.textContent = LABEL[a.s];
    const parts = [dot, who];
    if (a.from && a.s !== "no") { const w = document.createElement("span"); w.className = "when"; w.textContent = timeText(a.from); parts.push(w); }
    parts.push(tag);
    li.replaceChildren(...parts);
    ul.append(li); // appending an existing row moves it into its new place
    placed.push({ id, li, isNew, i });
  });
  // Measure only once every row is in its final place, then glide each from where it was.
  if (reduceMotion) return;
  for (const { id, li, isNew, i } of placed) {
    if (isNew) {
      li.animate([{ opacity: 0, transform: "translateY(10px) scale(.97)" }, { opacity: 1, transform: "none" }],
        { duration: 420, delay: swap ? i * 45 : 0, easing: "cubic-bezier(.34, 1.25, .64, 1)", fill: "backwards" });
    } else {
      const dy = before.get(id) - li.getBoundingClientRect().top;
      if (Math.abs(dy) > 1) li.animate([{ transform: `translateY(${dy}px)` }, { transform: "none" }], { duration: 420, easing: "cubic-bezier(.34, 1.3, .64, 1)" });
    }
  }
}

function prunedDays(daysMap) {
  const cutoff = new Date(today); cutoff.setDate(cutoff.getDate() - KEEP_DAYS);
  const ck = keyOf(cutoff), out = {};
  for (const [k, v] of Object.entries(daysMap || {})) if (k >= ck) out[k] = v;
  return out;
}

// Saves are instant on screen: the answer shows right away and is written in the
// background, one write after another. If a write fails, the screen goes back.
let saveChain = Promise.resolve();
function save(patch) {
  if (!db || !myId) { setStatus("Still connecting. Try again in a second.", true); return; }
  const prev = players[myId] || {};
  const next = { nick: prev.nick || "", days: prunedDays(prev.days) };
  if (patch.nick !== undefined) next.nick = patch.nick;
  if ("s" in patch) {
    const keepFrom = patch.s && patch.s !== "no" && next.days[selected]?.from;
    if (patch.s) next.days[selected] = keepFrom ? { s: patch.s, from: keepFrom } : { s: patch.s };
    else delete next.days[selected];
  }
  if ("from" in patch && next.days[selected]) {
    const day = { s: next.days[selected].s };
    if (patch.from) day.from = patch.from;
    next.days[selected] = day;
  }
  players[myId] = next;
  render();
  saveChain = saveChain
    .then(() => setDoc(doc(db, "players", myId), next))
    .then(() => setStatus("Saved", false, true))
    .catch(() => {
      players[myId] = prev;
      render();
      setStatus("Couldn't save. Check your connection and try again.", true);
    });
  return saveChain;
}

// A gamertag is required before answering, so nobody shows up as "Someone".
const typedNick = () => $("nick").value.trim().slice(0, 24);
const hasName = () => !!(players[myId]?.nick || typedNick());
function updateLock() {
  const named = hasName();
  $("choices").classList.toggle("locked", !named);
  $("nick").classList.toggle("need", !named);
}

buttons.forEach(b => b.addEventListener("click", () => {
  const typed = typedNick();
  if (!players[myId]?.nick && !typed) {
    setStatus("Type your gamertag first so the squad knows it's you.", true);
    $("nick").focus();
    return;
  }
  const mine = myId && players[myId]?.days?.[selected];
  const patch = { s: mine && mine.s === b.dataset.s ? null : b.dataset.s };
  clearTimeout(nickTimer);
  if (typed && typed !== (players[myId]?.nick || "")) {
    if (askIfTaken(typed, patch)) return;
    patch.nick = typed;
  }
  haptic();
  if (patch.s && !reduceMotion) { b.classList.remove("pop"); void b.offsetWidth; b.classList.add("pop"); }
  save(patch);
  if (patch.s) {
    pulseLights({ yes: "#4cc38a", maybe: "#f2c14e", no: "#e5484d" }[patch.s]);
    if (patch.s === "yes") sparkle(b);
  }
}));
let nickTimer;
function saveNick() {
  clearTimeout(nickTimer);
  const v = typedNick();
  // Never save an empty name over an existing one.
  if (myId && v && v !== (players[myId]?.nick || "") && !askIfTaken(v)) save({ nick: v });
}

// --- One person, one entry ----------------------------------------------------
// If someone types a gamertag that's already in the squad (say after re-adding the app
// or getting a new phone), ask whether it's them. "Yes" moves the old answers over and
// deletes the old copy; "No" makes them pick another name, so two people never share one.
const sameName = (a, b) => a.trim().toLowerCase() === b.trim().toLowerCase();
let claimId = null, claimPatch = null;

function takenBy(name) {
  const others = Object.keys(players).filter(id => id !== myId && sameName(players[id]?.nick || "", name));
  // Prefer the copy that actually has answers.
  others.sort((a, b) => Object.keys(players[b].days || {}).length - Object.keys(players[a].days || {}).length);
  return others[0] || null;
}

function askIfTaken(name, patch = null) {
  const id = takenBy(name);
  if (!id) return false;
  claimId = id; claimPatch = patch;
  $("claimText").textContent = `${players[id].nick} is already in the squad. Is that you?`;
  $("claim").hidden = false;
  setStatus("");
  return true;
}

function closeClaim() { $("claim").hidden = true; claimId = null; claimPatch = null; }

$("claimNo").addEventListener("click", () => {
  closeClaim();
  $("nick").value = players[myId]?.nick || "";
  $("nick").focus();
  updateLock();
  setStatus("Pick a different gamertag.", true);
});

$("claimYes").addEventListener("click", async () => {
  const oldId = claimId, pending = claimPatch, old = players[oldId];
  if (!old || !myId || writing) return;
  writing = true;
  const mine = players[myId] || {};
  // Old answers first, then anything already answered on this phone wins.
  const next = { nick: old.nick, replaces: oldId, days: prunedDays({ ...(old.days || {}), ...(mine.days || {}) }) };
  try {
    await setDoc(doc(db, "players", myId), next);
    players[myId] = next;
    try { await deleteDoc(doc(db, "players", oldId)); delete players[oldId]; } catch {}
    closeClaim();
    $("nick").value = next.nick;
    setStatus(`Welcome back, ${next.nick}. Your answers are back.`);
  } catch {
    setStatus("Couldn't move your answers. Check your connection and try again.", true);
  } finally {
    writing = false;
    render();
  }
  if (pending && "s" in pending) save({ s: pending.s });
});
$("nick").addEventListener("input", () => {
  updateLock();
  clearTimeout(nickTimer);
  nickTimer = setTimeout(saveNick, 900);
});
$("nick").addEventListener("keydown", (e) => { if (e.key === "Enter") $("nick").blur(); });
$("nick").addEventListener("blur", () => {
  if (!typedNick() && players[myId]?.nick) $("nick").value = players[myId].nick;
  saveNick(); updateLock();
});

// --- Christmas lights: the title written as one light cord ----------------------
// The words are a monoline script in the cord's colour, and one cord joins everything like a
// light string bent into writing: it starts at a bulb, runs into the first letter, bridges the
// gaps between words, loops from the end of each line back to the start of the next, then
// curls out of the last letter into a drape of hanging bulbs that ends at a little plug.
// Redrawn only when the title's size or text changes.
const BULB_COLORS = ["#ff5f5f", "#5aa9ff", "#ffd45a", "#52d08a"];
let lightsKey = "";
function drawLights() {
  const wrap = $("titleWrap"), label = $("askLabel");
  const w = wrap.clientWidth, h = wrap.clientHeight;
  const key = `${w}x${h}|${label.textContent}|${document.fonts?.check?.('1em Sacramento')}`;
  if (!w || !h || key === lightsKey) return;
  lightsKey = key;
  const box = wrap.getBoundingClientRect();
  const text = label.firstChild;
  if (!text) return;

  // Letter boxes, grouped into lines and words.
  const r = document.createRange(), chars = [];
  for (let i = 0; i < text.length; i++) {
    r.setStart(text, i); r.setEnd(text, i + 1);
    const rc = r.getClientRects()[0];
    if (rc && rc.width) chars.push({ ch: text.data[i], x: rc.left - box.left, y: rc.top - box.top, w: rc.width, h: rc.height });
  }
  if (!chars.length) return;
  const lines = [];
  for (const c of chars) {
    let ln = lines[lines.length - 1];
    if (!ln || Math.abs(ln.y - c.y) > c.h / 2) { ln = { y: c.y, h: c.h, words: [] }; lines.push(ln); }
    if (c.ch === " ") { ln.gap = true; continue; }
    let wd = ln.words[ln.words.length - 1];
    if (!wd || ln.gap) { wd = { x0: c.x, x1: c.x + c.w, chars: [] }; ln.words.push(wd); ln.gap = false; }
    wd.x1 = c.x + c.w; wd.chars.push(c);
  }
  for (const ln of lines) { ln.x0 = ln.words[0].x0; ln.x1 = ln.words[ln.words.length - 1].x1; }
  const fs = parseFloat(getComputedStyle(label).fontSize);
  const lineH = fs * 1.3;
  const join = (ln) => ln.y + ln.h * 0.5 + fs * 0.16;      // where the script's strokes join, near the baseline
  const inset = fs * 0.04;

  // A cubic piece, sampled, with optional curls (a full turn of the cord) along it.
  const pieces = [];
  const curve = (p0, c1, c2, p3, curls = [], N = 160) => {
    const B = (t) => { const u = 1 - t; return [0, 1].map(k => u*u*u*p0[k] + 3*u*u*t*c1[k] + 3*u*t*t*c2[k] + t*t*t*p3[k]); };
    const pts = [];
    for (let i = 0; i <= N; i++) {
      const t = i / N;
      let [x, y] = B(t);
      const a = B(Math.max(0, t - 0.003)), b = B(Math.min(1, t + 0.003));
      let tx = b[0] - a[0], ty = b[1] - a[1]; const tl = Math.hypot(tx, ty) || 1; tx /= tl; ty /= tl;
      for (const c of curls) {
        const d = t - c.at;
        if (Math.abs(d) < c.win) {
          const u = (d + c.win) / (2 * c.win), e = u * u * (3 - 2 * u), phi = 2 * Math.PI * e;
          const nx = -ty * c.side, ny = tx * c.side;
          x += c.R * (Math.sin(phi) * tx * 1.5 + (1 - Math.cos(phi)) * nx);
          y += c.R * (Math.sin(phi) * ty * 1.5 + (1 - Math.cos(phi)) * ny);
        }
      }
      pts.push({ x, y, tx, ty, t });
    }
    pieces.push(pts);
    return pts;
  };

  let k = 0, bulbs = "";
  const bulb = (x, y, deg) => {
    const col = BULB_COLORS[k % 4], tw = ["a", "b", "c"][k % 3]; k++;
    bulbs += `<g transform="translate(${x.toFixed(1)} ${y.toFixed(1)}) rotate(${deg.toFixed(0)})">` +
      `<rect class="socket" x="-2.2" y="-1" width="4.4" height="5" rx="1"/>` +
      `<g class="bulb ${tw}" data-c="${col}"><ellipse class="halo" cx="0" cy="9" rx="7.5" ry="9.5" fill="${col}" opacity=".18"/>` +
      `<path class="glass" d="M-3 4 C-4.6 7 -4.4 11.5 0 14 C4.4 11.5 4.6 7 3 4 Z" fill="${col}"/>` +
      `<ellipse cx="-1.2" cy="7.5" rx=".9" ry="1.8" fill="#fff" opacity=".55"/></g></g>`;
  };
  // Bulbs spaced along a piece, hanging to one side of it ("down" picks the lower side).
  const hang = (pts, gap, from = 0.08, to = 0.92, skip = () => false) => {
    let run = gap * 0.6;
    for (let i = 1; i < pts.length; i++) {
      const p = pts[i];
      run += Math.hypot(p.x - pts[i - 1].x, p.y - pts[i - 1].y);
      if (run < gap || p.t < from || p.t > to || skip(p.t)) continue;
      let nx = -p.ty, ny = p.tx; if (ny < 0) { nx = -nx; ny = -ny; }
      bulb(p.x, p.y, Math.atan2(ny, nx) * 180 / Math.PI - 90);
      run = 0;
    }
  };

  // 1. Lead-in: a bulb up and to the left of the first letter, cord curving down into it.
  const L0 = lines[0], y0 = join(L0);
  const st = [L0.x0 - fs * 0.35, L0.y + L0.h * 0.18];
  curve(st, [st[0] - fs * 0.05, y0 - fs * 0.05], [L0.x0 - fs * 0.25, y0 + fs * 0.05], [L0.x0 + inset, y0]);
  bulb(st[0], st[1], 145);

  // 2. Bridges over the spaces between words.
  for (const ln of lines) {
    const y = join(ln);
    for (let i = 1; i < ln.words.length; i++) {
      const a = [ln.words[i - 1].x1 - inset, y], b = [ln.words[i].x0 + inset, y], dip = fs * 0.3;
      curve(a, [a[0] + (b[0] - a[0]) * 0.33, y + dip], [a[0] + (b[0] - a[0]) * 0.67, y + dip], b, [], 30);
    }
  }

  // 3. From the end of each line, curl out to the right, sweep back under it, loop around the
  //    left and run into the start of the next line.
  for (let i = 0; i + 1 < lines.length; i++) {
    const A = lines[i], Bn = lines[i + 1];
    const ya = join(A), yb = join(Bn), mid = A.y + A.h * 0.5 + lineH * 0.55;
    const left = Math.min(A.x0, Bn.x0), right = Math.max(A.x1, Bn.x1);
    const room = Math.min(left, w - right);
    const pts = curve([A.x1 - inset, ya],
      [right + Math.min(room, fs * 0.7), ya + fs * 0.1],
      [left - Math.min(room, fs * 0.9), mid],
      [Bn.x0 + inset, yb],
      [{ at: 0.14, R: fs * 0.16, win: 0.06, side: -1 }, { at: 0.86, R: Math.min(fs * 0.26, room * 0.45 + 6), win: 0.07, side: 1 }], 260);
    hang(pts, fs * 0.75, 0.32, 0.6);
  }

  // 4. Out of the last letter: a curl on the right, a drape under the words with bulbs hanging
  //    from it, and the end of the cord dropping to a plug on the left.
  const L = lines[lines.length - 1], yl = join(L), under = L.y + L.h + fs * 0.18;
  const roomL = Math.min(L.x0, w - L.x1);
  const q = [L.x0 + fs * 0.15, under + fs * 0.3];
  const drape = curve([L.x1 - inset, yl], [L.x1 + Math.min(roomL * 0.8, fs * 0.9), yl + fs * 0.5],
    [L.x1 - fs * 0.6, under + fs * 0.55], q,
    [{ at: 0.12, R: Math.min(fs * 0.18, roomL * 0.4 + 2), win: 0.06, side: -1 }], 220);
  hang(drape, Math.max(30, fs * 0.6), 0.25, 0.97);
  const plug = [Math.max(8, L.x0 - fs * 0.5), under + fs * 0.62];
  curve(q, [q[0] - fs * 0.35, q[1] - fs * 0.02], [plug[0] + fs * 0.05, plug[1] - fs * 0.3], plug, [], 60);
  bulbs += `<g transform="translate(${plug[0].toFixed(1)} ${plug[1].toFixed(1)})">` +
    `<rect class="plug" x="-4" y="-1" width="8" height="9" rx="2"/>` +
    `<rect class="plug" x="-2.6" y="8" width="1.4" height="4" rx=".5"/><rect class="plug" x="1.2" y="8" width="1.4" height="4" rx=".5"/></g>`;

  // 5. A bulb or two clipped onto the tall letters of the first line.
  let lastX = -1e9, n = 0;
  for (const wd of lines[0].words) for (const c of wd.chars) {
    if (!/[A-Zbdfhklt]/.test(c.ch) || n >= 3 || (c.y === lines[0].y && c.x - lastX < fs * 1.2)) continue;
    if (Math.abs(c.x - lastX) < fs * 1.2 || Math.hypot(c.x - st[0], c.y - st[1]) < fs * 1.3) continue;
    lastX = c.x; n++;
    bulb(c.x + c.w * 0.55, c.y + c.h * 0.24, 180 + (n % 2 ? 14 : -12));
  }

  const d = pieces.map(pts => "M" + pts.map(p => p.x.toFixed(1) + " " + p.y.toFixed(1)).join(" L")).join(" ");
  $("lightsBack").innerHTML = "";
  $("lightsFront").innerHTML = `<path class="cord" pathLength="1" d="${d}"/>` + bulbs;
  if (!lightsShown && document.fonts?.check?.("1em Sacramento")) { lightsShown = true; switchOnLights(); }
}

// The first time the app opens, the cord draws itself in and the bulbs light up one by one,
// like plugging in a string of lights. About a second, once.
let lightsShown = false;
function switchOnLights() {
  if (reduceMotion) return;
  const svg = $("lightsFront");
  svg.querySelector(".cord")?.animate([{ strokeDasharray: 1, strokeDashoffset: 1 }, { strokeDasharray: 1, strokeDashoffset: 0 }],
    { duration: 900, easing: "cubic-bezier(.4, 0, .2, 1)" });
  [...svg.querySelectorAll(".bulb")].forEach((b, i) => {
    b.animate([{ opacity: 0.08, transform: "scale(.6)" }, { opacity: 1, transform: "scale(1.12)", offset: 0.6 }, { opacity: 1, transform: "none" }],
      { duration: 420, delay: 500 + i * 55, easing: EASE, fill: "backwards" });
  });
}

// After you answer, a wave of your answer's colour runs along the bulbs and fades back.
function pulseLights(color) {
  if (reduceMotion) return;
  [...$("lightsFront").querySelectorAll(".bulb")].forEach((b, i) => {
    const c = b.dataset.c;
    for (const part of b.querySelectorAll(".glass, .halo")) {
      part.animate([{ fill: c }, { fill: color, offset: 0.25 }, { fill: color, offset: 0.65 }, { fill: c }],
        { duration: 1300, delay: i * 30, easing: "ease-in-out" });
    }
  });
}

// A small burst of gold sparkles from the button when you tap I'm in.
function sparkle(btn) {
  if (reduceMotion) return;
  const r = btn.getBoundingClientRect(), cx = r.left + r.width / 2, cy = r.top + r.height / 2;
  const fx = $("fx"), COLS = ["#ffe39a", "#e9c46a", "#ffffff", "#4cc38a"];
  for (let i = 0; i < 14; i++) {
    const p = document.createElement("i");
    const size = 3 + Math.random() * 4, ang = (i / 14) * Math.PI * 2 + Math.random() * 0.4;
    const dist = 38 + Math.random() * 46;
    p.style.width = p.style.height = size + "px";
    p.style.background = COLS[i % COLS.length];
    p.style.boxShadow = `0 0 6px ${COLS[i % COLS.length]}`;
    fx.append(p);
    const x = cx + Math.cos(ang) * dist, y = cy + Math.sin(ang) * dist * 0.8;
    p.animate([
      { transform: `translate(${cx}px, ${cy}px) scale(.4)`, opacity: 1 },
      { transform: `translate(${x}px, ${y}px) scale(1)`, opacity: 1, offset: 0.55 },
      { transform: `translate(${x}px, ${y + 10}px) scale(.2)`, opacity: 0 },
    ], { duration: 700 + Math.random() * 200, easing: "cubic-bezier(.2, .8, .2, 1)" }).onfinish = () => p.remove();
  }
}
document.fonts?.ready.then(() => { lightsKey = ""; drawLights(); });
new ResizeObserver(drawLights).observe($("titleWrap"));

render();

// --- A little Christmas: light snow drifting behind the app --------------------
// Battery-friendly: ~26 small flakes in the top of the screen only, drawn at most 30 times
// a second (not 60-120), in three batches per frame, paused whenever the app isn't on screen.
// Off for people who turn on Reduce Motion.
(function snow() {
  const canvas = $("snow"), ctx = canvas.getContext("2d");
  if (reduceMotion || !ctx) { canvas.remove(); return; }
  const FRAME_MS = 1000 / 30;
  let w = 0, h = 0, flakes = [], raf = 0, last = 0, acc = 0;
  const resize = () => {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    w = canvas.clientWidth; h = canvas.clientHeight;
    canvas.width = Math.round(w * dpr); canvas.height = Math.round(h * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  };
  // Three depths: far flakes are tiny, dim and slow; near ones are bigger, softer and faster.
  const SIZE = [[0.5, 1], [1, 1.7], [1.8, 2.8]], SPEED = [[7, 12], [12, 20], [20, 30]];
  const make = (top) => {
    const layer = Math.random() < 0.45 ? 0 : Math.random() < 0.65 ? 1 : 2;
    const rnd = ([a, b]) => a + Math.random() * (b - a);
    return { x: Math.random() * w, y: top ? -6 : Math.random() * h, r: rnd(SIZE[layer]), vy: rnd(SPEED[layer]),
      sway: Math.random() * Math.PI * 2, swayAmt: 6 + layer * 5, layer };
  };
  resize();
  flakes = Array.from({ length: Math.round(Math.min(26, w / 15)) }, () => make(false));
  addEventListener("resize", resize);
  const ALPHA = [0.28, 0.5, 0.42];
  const tick = (t) => {
    raf = requestAnimationFrame(tick);
    acc += t - last; last = t;
    if (acc < FRAME_MS) return;          // skip frames to stay at ~30 fps
    const dt = Math.min(acc / 1000, 0.1); acc = 0;
    ctx.clearRect(0, 0, w, h);
    ctx.fillStyle = "#fff";
    for (let layer = 0; layer < 3; layer++) {
      ctx.globalAlpha = ALPHA[layer];
      ctx.beginPath();
      for (const f of flakes) {
        if (f.layer !== layer) continue;
        f.y += f.vy * dt; f.sway += dt * 0.8;
        if (f.y > h + 6) Object.assign(f, make(true));
        const x = f.x + Math.sin(f.sway) * f.swayAmt;
        ctx.moveTo(x + f.r, f.y); ctx.arc(x, f.y, f.r, 0, Math.PI * 2);
      }
      ctx.fill();
      if (layer === 2) {            // a soft glow around the near flakes, so they look out of focus
        ctx.globalAlpha = 0.1; ctx.beginPath();
        for (const f of flakes) if (f.layer === 2) { const x = f.x + Math.sin(f.sway) * f.swayAmt; ctx.moveTo(x + f.r * 2.4, f.y); ctx.arc(x, f.y, f.r * 2.4, 0, Math.PI * 2); }
        ctx.fill();
      }
    }
  };
  const stop = () => cancelAnimationFrame(raf);
  const start = () => { stop(); last = performance.now(); acc = 0; raf = requestAnimationFrame(tick); };
  document.addEventListener("visibilitychange", () => document.hidden ? stop() : start());
  addEventListener("pagehide", stop);
  start();
})();

// If the app was left open past midnight, reload so "tonight" means today again.
document.addEventListener("visibilitychange", () => {
  if (!document.hidden && keyOf(new Date()) !== todayKey) location.reload();
});

// --- Reminders (push notifications) ---------------------------------------
const isIOS = /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
const isInstalled = window.matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;
let swReg = null, messaging = null;

// The service worker shows notifications and makes the app always load its newest files.
// Register it right away (not only for reminders) and never let the phone cache sw.js itself.
const swReady = "serviceWorker" in navigator
  ? navigator.serviceWorker.register("sw.js", { scope: "./", updateViaCache: "none" }).catch(() => null)
  : Promise.resolve(null);
// When an updated service worker takes over, reload once so the new version shows straight away.
if ("serviceWorker" in navigator && navigator.serviceWorker.controller) {
  let reloaded = false;
  navigator.serviceWorker.addEventListener("controllerchange", () => { if (!reloaded) { reloaded = true; location.reload(); } });
}

async function saveToken() {
  const token = await getToken(messaging, { vapidKey: self.SQUAD_CONFIG.vapidKey, serviceWorkerRegistration: swReg });
  if (token && myId) await setDoc(doc(db, "tokens", myId), { token, updatedAt: Date.now() });
}

async function setupReminders() {
  const box = $("remind"), text = $("remindText"), btn = $("remindBtn");
  if (isIOS && !isInstalled) {
    box.hidden = false; btn.hidden = true;
    text.textContent = "For a daily reminder, add this to your Home Screen: tap Share, then Add to Home Screen, and open it from there.";
    return;
  }
  if (!("serviceWorker" in navigator) || !("Notification" in window) || !(await isSupported())) return;
  swReg = await swReady;
  if (!swReg) return;
  messaging = getMessaging();
  if (Notification.permission === "granted") { saveToken().catch(() => {}); return; }
  if (Notification.permission === "denied") {
    box.hidden = false; btn.hidden = true;
    text.textContent = "Reminders are blocked. Turn on notifications for this app in your phone's settings.";
    return;
  }
  box.hidden = false;
  btn.addEventListener("click", async () => {
    btn.disabled = true;
    const result = await Notification.requestPermission();
    if (result === "granted") {
      try { await saveToken(); box.hidden = true; setStatus("Daily reminder is on"); }
      catch { text.textContent = "Couldn't turn on reminders. Try again later."; btn.disabled = false; }
    } else {
      btn.hidden = true;
      text.textContent = "No reminder. You can turn notifications on later in your phone's settings.";
    }
  });
}

// --- Start ------------------------------------------------------------------
const cfg = self.SQUAD_CONFIG;
if (!cfg || !cfg.firebase || cfg.firebase.apiKey === "PASTE_HERE") {
  setStatus("Setup needed: paste your Firebase settings into config.js.", true);
} else {
  const app = initializeApp(cfg.firebase);
  db = getFirestore(app);
  const auth = getAuth(app);
  onAuthStateChanged(auth, (u) => {
    if (!u) return;
    const first = !myId;
    myId = u.uid;
    if (!first) return;
    onSnapshot(collection(db, "players"), (snap) => {
      const next = {};
      snap.forEach(d => { next[d.id] = d.data(); });
      players = next;
      if ($("status").textContent === "Connecting…") setStatus(players[myId]?.nick ? "" : "Type your gamertag to answer.");
      render();
    }, () => setStatus("Lost connection. Close and reopen the app.", true));
    setupReminders().catch(() => {});
  });
  signInAnonymously(auth).catch(() => setStatus("Couldn't connect. Check your internet and reopen the app.", true));
}
</script>
