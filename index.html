<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Squad Check-in</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png?v=halloween">
<link rel="apple-touch-icon" href="icon-180.png?v=halloween">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Squad">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#130e1c">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Creepster&family=Figtree:wght@400;500;600&display=swap">
<style>
/* Halloween night: one quiet centered column under a pumpkin-glow sky.
   Deliberately dark in both system themes. */
:root {
  --bg: #130e1c;        /* night purple */
  --glow: #4a2410;      /* pumpkin light at the top of the sky */
  --ink: #f3ece2;       /* candle-wax white */
  --muted: #8f8499;
  --line: #2c2238;
  --pumpkin: #ff7b1c;
  --yes: #7fd858;       /* slime green */
  --maybe: #ffc13b;     /* candle yellow */
  --no: #ee3f52;        /* blood red */
  --on-yes: #102207;
  --on-maybe: #2b1d00;
  --on-no: #2a050a;
  --font-display: "Creepster", "Trebuchet MS", system-ui, sans-serif;
  --font-body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; min-height: 100vh; color: var(--ink);
  background: radial-gradient(ellipse 130% 45% at 50% -8%, var(--glow), transparent 70%) no-repeat, var(--bg); font-family: var(--font-body); font-size: 15px; line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-top: calc(env(safe-area-inset-top, 0px) + 40px);
  padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 48px);
  -webkit-tap-highlight-color: transparent;
}
[hidden] { display: none !important; }
.wrap { max-width: 440px; margin: 0 auto; display: flex; flex-direction: column; gap: 36px; }
.date { font-size: 0.8rem; color: var(--pumpkin); text-transform: uppercase; letter-spacing: 0.12em; text-align: center; margin: 0 0 8px; }
.ask {
  font-family: var(--font-display); font-weight: 400; font-size: 2.3rem; line-height: 1.1; letter-spacing: 0.03em;
  text-align: center; margin: 0; text-wrap: balance; color: var(--pumpkin);
  text-shadow: 0 0 18px color-mix(in srgb, var(--pumpkin) 45%, transparent);
}

.choices { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.choice {
  --c: var(--line); --on: var(--ink);
  font: 600 0.95rem var(--font-body); padding: 16px 6px; border-radius: 12px; cursor: pointer;
  border: 2px solid var(--c); background: transparent; color: var(--c);
  transition: background .15s, color .15s, transform .08s;
}
.choice[data-s="yes"] { --c: var(--yes); --on: var(--on-yes); }
.choice[data-s="maybe"] { --c: var(--maybe); --on: var(--on-maybe); }
.choice[data-s="no"] { --c: var(--no); --on: var(--on-no); }
@media (hover: hover) { .choice:hover { background: color-mix(in srgb, var(--c) 14%, transparent); } }
.choice[aria-pressed="true"] { background: var(--c); color: var(--on); }
.choice:active { transform: scale(0.97); }
.choice:disabled { opacity: .6; cursor: wait; }
.choice:focus-visible, .nick:focus-visible, .day:focus-visible, .remind button:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }

.choices.locked .choice { opacity: .3; }
.nick {
  display: block; margin: 0 auto 16px; width: 100%; max-width: 220px; text-align: center;
  font: 500 16px var(--font-body); color: var(--ink); background: transparent;
  border: 0; border-bottom: 1px solid var(--line); padding: 6px 4px; border-radius: 0;
}
.nick::placeholder { color: var(--muted); }
.nick.need { border-bottom: 2px solid var(--pumpkin); }
.status { font-size: 0.8rem; color: var(--muted); text-align: center; min-height: 1.2em; margin: 8px 0 0; }
.status.err { color: var(--no); }
.claim { margin-top: 14px; display: flex; flex-direction: column; gap: 10px; text-align: center; }
.claim p { margin: 0; font-size: 0.9rem; }

.roster { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px; }
.roster li { display: flex; align-items: center; gap: 12px; padding: 8px 0; }
.dot { width: 10px; height: 10px; border-radius: 50%; flex: none; }
.dot.yes { background: var(--yes); } .dot.maybe { background: var(--maybe); } .dot.no { background: var(--no); }
.who { flex: 1; min-width: 0; overflow-wrap: anywhere; font-weight: 500; }
.who small { color: var(--muted); font-weight: 400; }
.tag { font-size: 0.8rem; font-weight: 600; }
.tag.yes { color: var(--yes); } .tag.maybe { color: var(--maybe); } .tag.no { color: var(--no); }
.empty { color: var(--muted); margin: 0; text-align: center; font-size: 0.9rem; }

.week { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; border-bottom: 1px solid var(--line); padding-bottom: 14px; margin-bottom: -12px; }
.day {
  display: flex; flex-direction: column; align-items: center; gap: 5px; padding: 6px 0; border-radius: 10px;
  background: transparent; border: 0; cursor: pointer; color: var(--muted); font: inherit;
}
.day[aria-current="true"] { color: var(--ink); background: var(--line); }
.day .dn { font-size: 0.7rem; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; }
.day .dd { font-size: 0.95rem; font-weight: 500; font-variant-numeric: tabular-nums; }
.day .bar { display: flex; gap: 2px; height: 6px; align-items: center; }
.day .bar i { width: 6px; height: 6px; border-radius: 50%; background: var(--yes); }
.day .bar i.maybe { background: var(--maybe); }
.day .bar i.no { background: var(--no); }
.day .bar { flex-wrap: wrap; justify-content: center; height: auto; min-height: 6px; max-width: 34px; row-gap: 2px; }

.times-wrap { margin-top: 16px; display: flex; flex-direction: column; gap: 8px; }
.times-label { margin: 0; font-size: 0.8rem; color: var(--muted); text-align: center; }
/* iPhone-alarm style wheel: 5 rows visible, the middle one is the pick */
.wheel {
  --row: 36px;
  position: relative; display: flex; justify-content: center; align-items: center; gap: 2px;
  height: calc(var(--row) * 5); user-select: none; -webkit-user-select: none;
  -webkit-mask-image: linear-gradient(to bottom, transparent, #000 32%, #000 68%, transparent);
  mask-image: linear-gradient(to bottom, transparent, #000 32%, #000 68%, transparent);
}
.wheel::before {
  content: ""; position: absolute; left: 50%; top: calc(var(--row) * 2); transform: translateX(-50%);
  width: 150px; height: var(--row); border-radius: 9px; background: var(--line);
}
.wheel-col {
  position: relative; width: 60px; height: 100%; overflow-y: scroll; scroll-snap-type: y mandatory;
  padding-block: calc(var(--row) * 2); overscroll-behavior: contain; scrollbar-width: none; outline: none;
}
.wheel-col::-webkit-scrollbar { display: none; }
.wheel-col:focus-visible { box-shadow: inset 0 0 0 2px var(--ink); border-radius: 9px; }
.wheel-item {
  height: var(--row); line-height: var(--row); text-align: center; scroll-snap-align: center; cursor: pointer;
  font: 500 1.35rem var(--font-body); font-variant-numeric: tabular-nums; color: var(--ink);
}
.wheel.unset .wheel-item { color: var(--muted); }
.wheel-sep { position: relative; font: 600 1.35rem var(--font-body); color: var(--ink); }
.wheel.unset .wheel-sep { color: var(--muted); }
.time-actions { display: flex; gap: 6px; justify-content: center; }
.chip {
  font: 600 0.8rem var(--font-body); color: var(--ink); background: transparent;
  border: 1px solid var(--line); border-radius: 999px; padding: 6px 12px; cursor: pointer; min-height: 32px;
}
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.chip:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.when { font-size: 0.8rem; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }

.remind { text-align: center; font-size: 0.85rem; color: var(--muted); display: flex; flex-direction: column; align-items: center; gap: 8px; }
.remind p { margin: 0; max-width: 32ch; }
.remind button {
  font: 600 0.85rem var(--font-body); color: var(--ink); background: transparent; cursor: pointer;
  border: 1px solid var(--line); border-radius: 999px; padding: 8px 16px;
}
@media (prefers-reduced-motion: reduce) { .choice { transition: none; } }
</style>
<script src="config.js"></script>
</head>
<body>
<div class="wrap">
  <nav class="week" id="week" aria-label="Pick a day"></nav>
  <section>
    <p class="date" id="dateLabel"></p>
    <p class="ask" id="askLabel">Can you play tonight?</p>
  </section>

  <section>
    <label for="nick" hidden>Your gamertag</label>
    <input class="nick" id="nick" maxlength="24" autocomplete="nickname" enterkeyhint="done" placeholder="your gamertag">
    <div class="choices" id="choices" role="group" aria-label="Your answer">
      <button class="choice" id="btnYes" data-s="yes" aria-pressed="false">I'm in</button>
      <button class="choice" id="btnMaybe" data-s="maybe" aria-pressed="false">Maybe</button>
      <button class="choice" id="btnNo" data-s="no" aria-pressed="false">Can't</button>
    </div>
    <div class="times-wrap" id="timesWrap" hidden>
      <p class="times-label" id="timesLabel">What time can you get on?</p>
      <div class="wheel unset" id="wheel" role="group" aria-labelledby="timesLabel">
        <div class="wheel-col" id="wheelH" tabindex="0" aria-label="Hour"></div>
        <span class="wheel-sep" aria-hidden="true">:</span>
        <div class="wheel-col" id="wheelM" tabindex="0" aria-label="Minutes"></div>
      </div>
      <div class="time-actions">
        <button class="chip" id="btnNow" type="button" aria-pressed="false">I'm on now</button>
        <button class="chip" id="btnClearTime" type="button">No set time</button>
      </div>
    </div>
    <div class="claim" id="claim" hidden>
      <p id="claimText"></p>
      <div class="time-actions">
        <button class="chip" id="claimYes" type="button">Yes, that's me</button>
        <button class="chip" id="claimNo" type="button">No, pick another name</button>
      </div>
    </div>
    <p class="status" id="status">Connecting…</p>
  </section>

  <section aria-label="Who's playing">
    <ul class="roster" id="roster"></ul>
    <p class="empty" id="rosterEmpty">No answers yet.</p>
  </section>


  <section class="remind" id="remind" hidden>
    <p id="remindText">Get a daily reminder to check in.</p>
    <button id="remindBtn" type="button">Turn on daily reminder</button>
  </section>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, collection, doc, onSnapshot, setDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { getMessaging, getToken, isSupported } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-messaging.js";

const KEEP_DAYS = 14;
const $ = (id) => document.getElementById(id);
const pad = (n) => String(n).padStart(2, "0");
const keyOf = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const today = new Date(); today.setHours(0, 0, 0, 0);
const days = Array.from({ length: 7 }, (_, i) => { const d = new Date(today); d.setDate(d.getDate() + i); return d; });
const todayKey = keyOf(today);

let selected = todayKey;
let db = null, myId = null, players = {}, writing = false;
const buttons = [$("btnYes"), $("btnMaybe"), $("btnNo")];
const LABEL = { yes: "In", maybe: "Maybe", no: "Can't" };

function setStatus(msg, err) { const s = $("status"); s.textContent = msg; s.classList.toggle("err", !!err); }
function selDate() { return days.find(d => keyOf(d) === selected) || today; }
function prettyDay(d) {
  if (keyOf(d) === todayKey) return "tonight";
  const t = new Date(today); t.setDate(t.getDate() + 1);
  if (keyOf(d) === keyOf(t)) return "tomorrow";
  return "on " + d.toLocaleDateString(undefined, { weekday: "long" });
}
function nameFor(id) {
  const p = players[id];
  return (p && typeof p.nick === "string" && p.nick.trim()) || "Someone";
}

// "now" sorts first, then times in order, then people who didn't pick a time.
const timeKey = (a) => a.from === "now" ? "00" : (a.from || "99");
const timeText = (from) => from === "now" ? "now" : from;

// --- Time wheel ---------------------------------------------------------------
const ROW = 36;
const HOURS = Array.from({ length: 24 }, (_, h) => pad(h));
const MINS = Array.from({ length: 12 }, (_, i) => pad(i * 5));
let wheelTouched = false, wheelTimer = null, wheelShown = null;

// Each column repeats its values several times so it feels endless (23 → 00).
// After every scroll we quietly jump back to the middle copy.
const COPIES = 7, MID = 3;
const colIndex = (el, n) => ((Math.round(el.scrollTop / ROW) % n) + n) % n;
const recenter = (el, n) => { const top = (MID * n + colIndex(el, n)) * ROW; if (el.scrollTop !== top) el.scrollTop = top; };
const wheelValue = () => `${HOURS[colIndex($("wheelH"), 24)]}:${MINS[colIndex($("wheelM"), 12)]}`;
const myAnswer = () => myId && players[myId]?.days?.[selected];

function defaultTime() {
  if (selected !== todayKey) return "20:00";
  return `${pad(Math.min(new Date().getHours() + 1, 23))}:00`;
}

// Save once the wheel has settled after the person scrolled or tapped it.
function scheduleCommit() {
  wheelTouched = true;
  clearTimeout(wheelTimer);
  wheelTimer = setTimeout(() => {
    wheelTouched = false;
    recenter($("wheelH"), 24); recenter($("wheelM"), 12);
    const v = wheelValue(), mine = myAnswer();
    wheelShown = `${selected}|${v}`;
    if (mine && mine.from !== v) save({ from: v });
  }, 400);
}

function buildCol(el, values) {
  for (let c = 0; c < COPIES; c++) values.forEach((v, i) => {
    const row = c * values.length + i;
    const d = document.createElement("div"); d.className = "wheel-item"; d.textContent = v;
    if (c !== MID) d.setAttribute("aria-hidden", "true");
    d.addEventListener("click", () => { el.scrollTo({ top: row * ROW, behavior: "smooth" }); scheduleCommit(); });
    el.append(d);
  });
  el.addEventListener("scroll", () => { if (wheelTouched) scheduleCommit(); }, { passive: true });
  for (const ev of ["pointerdown", "touchstart", "wheel"]) el.addEventListener(ev, scheduleCommit, { passive: true });
  el.addEventListener("keydown", (e) => {
    if (e.key !== "ArrowDown" && e.key !== "ArrowUp") return;
    e.preventDefault();
    el.scrollBy({ top: e.key === "ArrowDown" ? ROW : -ROW, behavior: "smooth" });
    scheduleCommit();
  });
}
buildCol($("wheelH"), HOURS);
buildCol($("wheelM"), MINS);

function setWheel(from) {
  const [h, m] = from.split(":").map(Number);
  $("wheelH").scrollTop = (MID * 24 + h) * ROW;
  $("wheelM").scrollTop = (MID * 12 + Math.min(11, Math.round(m / 5))) * ROW;
}

$("btnNow").addEventListener("click", () => { const mine = myAnswer(); if (mine) save({ from: mine.from === "now" ? "" : "now" }); });
$("btnClearTime").addEventListener("click", () => save({ from: "" }));

function renderTimes(mine) {
  const wrap = $("timesWrap");
  const show = !!mine && (mine.s === "yes" || mine.s === "maybe");
  wrap.hidden = !show;
  if (!show) { wheelShown = null; return; }
  const set = !!mine.from && mine.from !== "now";
  $("timesLabel").textContent = mine.from === "now" ? "You're getting on now"
    : set ? `Online from ${mine.from}`
    : mine.s === "yes" ? "Scroll to pick when you'll get on" : "If you can, around what time?";
  $("btnNow").hidden = selected !== todayKey;
  $("btnNow").setAttribute("aria-pressed", String(mine.from === "now"));
  $("btnClearTime").hidden = !mine.from;
  $("wheel").classList.toggle("unset", !set);
  // Move the wheel only when the answer or day changed, never while someone is scrolling it.
  const target = set ? mine.from : defaultTime();
  if (!wheelTouched && wheelShown !== `${selected}|${target}`) { wheelShown = `${selected}|${target}`; setWheel(target); }
}

function render() {
  const d = selDate();
  $("dateLabel").textContent = d.toLocaleDateString(undefined, { weekday: "long", month: "short", day: "numeric" });
  $("askLabel").textContent = `Can you play ${prettyDay(d)}?`;

  const ids = Object.keys(players);
  const order = { yes: 0, maybe: 1, no: 2 };
  const answered = ids
    .map(id => ({ id, a: players[id]?.days?.[selected] }))
    .filter(x => x.a && order[x.a.s] !== undefined)
    .sort((x, y) => order[x.a.s] - order[y.a.s] || timeKey(x.a).localeCompare(timeKey(y.a)));

  const ul = $("roster"); ul.replaceChildren();
  for (const { id, a } of answered) {
    const li = document.createElement("li");
    const dot = document.createElement("span"); dot.className = `dot ${a.s}`;
    const who = document.createElement("span"); who.className = "who"; who.textContent = nameFor(id);
    if (id === myId) { const s = document.createElement("small"); s.textContent = " (you)"; who.append(s); }
    const tag = document.createElement("span"); tag.className = `tag ${a.s}`; tag.textContent = LABEL[a.s];
    li.append(dot, who);
    if (a.from && a.s !== "no") { const w = document.createElement("span"); w.className = "when"; w.textContent = timeText(a.from); li.append(w); }
    li.append(tag);
    ul.append(li);
  }
  $("rosterEmpty").hidden = answered.length > 0;

  const mine = myId && players[myId]?.days?.[selected];
  buttons.forEach(b => b.setAttribute("aria-pressed", String(!!mine && mine.s === b.dataset.s)));
  renderTimes(mine);
  if (document.activeElement !== $("nick") && myId) $("nick").value = players[myId]?.nick || $("nick").value;
  updateLock();

  const week = $("week"); week.replaceChildren();
  for (const day of days) {
    const k = keyOf(day);
    const yes = ids.filter(id => players[id]?.days?.[k]?.s === "yes").length;
    const maybe = ids.filter(id => players[id]?.days?.[k]?.s === "maybe").length;
    const no = ids.filter(id => players[id]?.days?.[k]?.s === "no").length;
    const b = document.createElement("button"); b.className = "day"; b.type = "button";
    b.setAttribute("aria-current", String(k === selected));
    b.setAttribute("aria-label", `${day.toLocaleDateString(undefined, { weekday: "long" })}: ${yes} in, ${maybe} maybe, ${no} can't`);
    const dn = document.createElement("span"); dn.className = "dn"; dn.textContent = day.toLocaleDateString(undefined, { weekday: "short" });
    const dd = document.createElement("span"); dd.className = "dd"; dd.textContent = day.getDate();
    const bar = document.createElement("span"); bar.className = "bar";
    // One dot per answer: green in, yellow maybe, red can't (up to 8, which wraps to two rows).
    const dots = [...Array(yes).fill(""), ...Array(maybe).fill("maybe"), ...Array(no).fill("no")].slice(0, 8);
    for (const cls of dots) { const d = document.createElement("i"); if (cls) d.className = cls; bar.append(d); }
    b.append(dn, dd, bar);
    b.addEventListener("click", () => { selected = k; render(); });
    week.append(b);
  }
}

function prunedDays(daysMap) {
  const cutoff = new Date(today); cutoff.setDate(cutoff.getDate() - KEEP_DAYS);
  const ck = keyOf(cutoff), out = {};
  for (const [k, v] of Object.entries(daysMap || {})) if (k >= ck) out[k] = v;
  return out;
}

async function save(patch) {
  if (!db || !myId) { setStatus("Still connecting. Try again in a second.", true); return; }
  if (writing) return;
  writing = true; buttons.forEach(b => b.disabled = true);
  const prev = players[myId] || {};
  const next = { nick: prev.nick || "", days: prunedDays(prev.days) };
  if (patch.nick !== undefined) next.nick = patch.nick;
  if ("s" in patch) {
    const keepFrom = patch.s && patch.s !== "no" && next.days[selected]?.from;
    if (patch.s) next.days[selected] = keepFrom ? { s: patch.s, from: keepFrom } : { s: patch.s };
    else delete next.days[selected];
  }
  if ("from" in patch && next.days[selected]) {
    const day = { s: next.days[selected].s };
    if (patch.from) day.from = patch.from;
    next.days[selected] = day;
  }
  try {
    await setDoc(doc(db, "players", myId), next);
    players[myId] = next;
    setStatus("Saved");
  } catch {
    setStatus("Couldn't save. Check your connection and try again.", true);
  } finally {
    writing = false; buttons.forEach(b => b.disabled = false); render();
  }
}

// A gamertag is required before answering, so nobody shows up as "Someone".
const typedNick = () => $("nick").value.trim().slice(0, 24);
const hasName = () => !!(players[myId]?.nick || typedNick());
function updateLock() {
  const named = hasName();
  $("choices").classList.toggle("locked", !named);
  $("nick").classList.toggle("need", !named);
}

buttons.forEach(b => b.addEventListener("click", () => {
  const typed = typedNick();
  if (!players[myId]?.nick && !typed) {
    setStatus("Type your gamertag first so the squad knows it's you.", true);
    $("nick").focus();
    return;
  }
  const mine = myId && players[myId]?.days?.[selected];
  const patch = { s: mine && mine.s === b.dataset.s ? null : b.dataset.s };
  clearTimeout(nickTimer);
  if (typed && typed !== (players[myId]?.nick || "")) {
    if (askIfTaken(typed, patch)) return;
    patch.nick = typed;
  }
  save(patch);
}));
let nickTimer;
function saveNick() {
  clearTimeout(nickTimer);
  const v = typedNick();
  // Never save an empty name over an existing one.
  if (myId && v && v !== (players[myId]?.nick || "") && !askIfTaken(v)) save({ nick: v });
}

// --- One person, one entry ----------------------------------------------------
// If someone types a gamertag that's already in the squad (say after re-adding the app
// or getting a new phone), ask whether it's them. "Yes" moves the old answers over and
// deletes the old copy; "No" makes them pick another name, so two people never share one.
const sameName = (a, b) => a.trim().toLowerCase() === b.trim().toLowerCase();
let claimId = null, claimPatch = null;

function takenBy(name) {
  const others = Object.keys(players).filter(id => id !== myId && sameName(players[id]?.nick || "", name));
  // Prefer the copy that actually has answers.
  others.sort((a, b) => Object.keys(players[b].days || {}).length - Object.keys(players[a].days || {}).length);
  return others[0] || null;
}

function askIfTaken(name, patch = null) {
  const id = takenBy(name);
  if (!id) return false;
  claimId = id; claimPatch = patch;
  $("claimText").textContent = `${players[id].nick} is already in the squad. Is that you?`;
  $("claim").hidden = false;
  setStatus("");
  return true;
}

function closeClaim() { $("claim").hidden = true; claimId = null; claimPatch = null; }

$("claimNo").addEventListener("click", () => {
  closeClaim();
  $("nick").value = players[myId]?.nick || "";
  $("nick").focus();
  updateLock();
  setStatus("Pick a different gamertag.", true);
});

$("claimYes").addEventListener("click", async () => {
  const oldId = claimId, pending = claimPatch, old = players[oldId];
  if (!old || !myId || writing) return;
  writing = true;
  const mine = players[myId] || {};
  // Old answers first, then anything already answered on this phone wins.
  const next = { nick: old.nick, replaces: oldId, days: prunedDays({ ...(old.days || {}), ...(mine.days || {}) }) };
  try {
    await setDoc(doc(db, "players", myId), next);
    players[myId] = next;
    try { await deleteDoc(doc(db, "players", oldId)); delete players[oldId]; } catch {}
    closeClaim();
    $("nick").value = next.nick;
    setStatus(`Welcome back, ${next.nick}. Your answers are back.`);
  } catch {
    setStatus("Couldn't move your answers. Check your connection and try again.", true);
  } finally {
    writing = false;
    render();
  }
  if (pending && "s" in pending) save({ s: pending.s });
});
$("nick").addEventListener("input", () => {
  updateLock();
  clearTimeout(nickTimer);
  nickTimer = setTimeout(saveNick, 900);
});
$("nick").addEventListener("keydown", (e) => { if (e.key === "Enter") $("nick").blur(); });
$("nick").addEventListener("blur", () => {
  if (!typedNick() && players[myId]?.nick) $("nick").value = players[myId].nick;
  saveNick(); updateLock();
});

render();

// --- Reminders (push notifications) ---------------------------------------
const isIOS = /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
const isInstalled = window.matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;
let swReg = null, messaging = null;

// The service worker shows notifications and makes the app always load its newest files.
// Register it right away (not only for reminders) and never let the phone cache sw.js itself.
const swReady = "serviceWorker" in navigator
  ? navigator.serviceWorker.register("sw.js", { scope: "./", updateViaCache: "none" }).catch(() => null)
  : Promise.resolve(null);
// When an updated service worker takes over, reload once so the new version shows straight away.
if ("serviceWorker" in navigator && navigator.serviceWorker.controller) {
  let reloaded = false;
  navigator.serviceWorker.addEventListener("controllerchange", () => { if (!reloaded) { reloaded = true; location.reload(); } });
}

async function saveToken() {
  const token = await getToken(messaging, { vapidKey: self.SQUAD_CONFIG.vapidKey, serviceWorkerRegistration: swReg });
  if (token && myId) await setDoc(doc(db, "tokens", myId), { token, updatedAt: Date.now() });
}

async function setupReminders() {
  const box = $("remind"), text = $("remindText"), btn = $("remindBtn");
  if (isIOS && !isInstalled) {
    box.hidden = false; btn.hidden = true;
    text.textContent = "For a daily reminder, add this to your Home Screen: tap Share, then Add to Home Screen, and open it from there.";
    return;
  }
  if (!("serviceWorker" in navigator) || !("Notification" in window) || !(await isSupported())) return;
  swReg = await swReady;
  if (!swReg) return;
  messaging = getMessaging();
  if (Notification.permission === "granted") { saveToken().catch(() => {}); return; }
  if (Notification.permission === "denied") {
    box.hidden = false; btn.hidden = true;
    text.textContent = "Reminders are blocked. Turn on notifications for this app in your phone's settings.";
    return;
  }
  box.hidden = false;
  btn.addEventListener("click", async () => {
    btn.disabled = true;
    const result = await Notification.requestPermission();
    if (result === "granted") {
      try { await saveToken(); box.hidden = true; setStatus("Daily reminder is on"); }
      catch { text.textContent = "Couldn't turn on reminders. Try again later."; btn.disabled = false; }
    } else {
      btn.hidden = true;
      text.textContent = "No reminder. You can turn notifications on later in your phone's settings.";
    }
  });
}

// --- Start ------------------------------------------------------------------
const cfg = self.SQUAD_CONFIG;
if (!cfg || !cfg.firebase || cfg.firebase.apiKey === "PASTE_HERE") {
  setStatus("Setup needed: paste your Firebase settings into config.js.", true);
} else {
  const app = initializeApp(cfg.firebase);
  db = getFirestore(app);
  const auth = getAuth(app);
  onAuthStateChanged(auth, (u) => {
    if (!u) return;
    const first = !myId;
    myId = u.uid;
    if (!first) return;
    onSnapshot(collection(db, "players"), (snap) => {
      const next = {};
      snap.forEach(d => { next[d.id] = d.data(); });
      players = next;
      if ($("status").textContent === "Connecting…") setStatus(players[myId]?.nick ? "" : "Type your gamertag to answer.");
      render();
    }, () => setStatus("Lost connection. Close and reopen the app.", true));
    setupReminders().catch(() => {});
  });
  signInAnonymously(auth).catch(() => setStatus("Couldn't connect. Check your internet and reopen the app.", true));
}
</script>
</body>
</html>
